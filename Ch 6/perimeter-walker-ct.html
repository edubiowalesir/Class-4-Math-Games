<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Perimeter Walker | Class 4 Measuring Length — CT Tie-in</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: linear-gradient(160deg, #eafaf1 0%, #fef9e7 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    user-select: none;
  }
  .app {
    width: 100%;
    max-width: 1000px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    padding: 20px 28px 28px;
  }
  header { text-align: center; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 2rem; color: #2f855a; }
  .subtitle { margin: 6px 0 0; color: #555; font-size: 1rem; }

  .shapeTabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 18px 0 8px;
    flex-wrap: wrap;
  }
  .tabBtn {
    font-size: 1rem;
    font-weight: 800;
    padding: 10px 18px;
    border-radius: 12px;
    border: 3px solid #cbd5e0;
    background: #f7fafc;
    cursor: pointer;
    color: #444;
  }
  .tabBtn.active {
    background: #c6f6d5;
    border-color: #38a169;
    color: #22543d;
  }

  .totalBox {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 800;
    color: #2f855a;
    background: #f0fff4;
    border: 3px solid #9ae6b4;
    border-radius: 14px;
    padding: 10px;
    margin: 12px 0 16px;
  }

  .stageWrap {
    display: flex;
    justify-content: center;
    background: #fbfdff;
    border: 3px dashed #bcd8f5;
    border-radius: 18px;
    overflow-x: auto;
    padding: 20px;
    margin-bottom: 16px;
  }
  .stage {
    position: relative;
    width: 600px;
    height: 300px;
    flex-shrink: 0;
  }
  .edge {
    position: absolute;
    height: 0;
    border-top: 4px dashed #cbd5e0;
    transform-origin: 0 50%;
  }
  .edge.walked {
    border-top: 6px solid #38a169;
  }
  .edgeLabel {
    position: absolute;
    font-size: 0.85rem;
    font-weight: 800;
    color: #a0aec0;
    background: #ffffffcc;
    padding: 1px 6px;
    border-radius: 6px;
    transform: translate(-50%, -50%);
  }
  .edgeLabel.walked { color: #22543d; }
  .vertexDot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #4a5568;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .walker {
    position: absolute;
    font-size: 30px;
    transform: translate(-50%, -50%);
    transition: left 0.8s ease, top 0.8s ease;
    z-index: 5;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3));
  }

  .stepsList {
    max-width: 560px;
    margin: 0 auto 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .stepChip {
    font-size: 0.9rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 10px;
    background: #edf2f7;
    color: #718096;
    border: 2px solid #e2e8f0;
  }
  .stepChip.done { background: #c6f6d5; color: #22543d; border-color: #38a169; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 6px;
  }
  button.ctrl {
    font-size: 1.05rem;
    font-weight: 700;
    padding: 12px 22px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
  }
  #nextBtn { background: #38a169; }
  #autoBtn { background: #3182ce; }
  #restartBtn { background: #a0aec0; }
  button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ctrl:active { transform: scale(0.96); }

  .feedback {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 800;
    color: #2f855a;
    min-height: 30px;
    margin-top: 16px;
  }

  .ctTip {
    margin-top: 18px;
    text-align: center;
    font-size: 0.9rem;
    color: #718096;
    font-style: italic;
  }

  @media (max-width: 640px) {
    h1 { font-size: 1.4rem; }
    .stage { width: 500px; height: 260px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🐢 Perimeter Walker</h1>
    <p class="subtitle">Watch the turtle walk each side — add up every step to find the perimeter!</p>
  </header>

  <div class="shapeTabs" id="shapeTabs"></div>

  <div class="totalBox">Distance walked so far: <span id="total">0</span> cm</div>

  <div class="stageWrap">
    <div class="stage" id="stage"></div>
  </div>

  <div class="stepsList" id="stepsList"></div>

  <div class="controls">
    <button class="ctrl" id="nextBtn">🐢 Walk Next Side</button>
    <button class="ctrl" id="autoBtn">⏩ Auto-Walk All</button>
    <button class="ctrl" id="restartBtn">↩️ Restart</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <p class="ctTip">💡 Computational Thinking: we <b>decomposed</b> the shape into separate sides, then followed the same <b>sequence</b> of steps for each one — walk, measure, add.</p>
</div>

<script>
  const SCALE = 28;       // px per cm
  const START = { x: 60, y: 60 };

  const SHAPES = {
    rect: {
      label: '🟩 Rectangle Field',
      steps: [
        { dir: 'right', len: 6 },
        { dir: 'down', len: 3 },
        { dir: 'left', len: 6 },
        { dir: 'up', len: 3 }
      ]
    },
    square: {
      label: '🟦 Square Plot',
      steps: [
        { dir: 'right', len: 4 },
        { dir: 'down', len: 4 },
        { dir: 'left', len: 4 },
        { dir: 'up', len: 4 }
      ]
    },
    lshape: {
      label: '🟨 L-shape Garden',
      steps: [
        { dir: 'right', len: 5 },
        { dir: 'down', len: 2 },
        { dir: 'right', len: 3 },
        { dir: 'down', len: 2 },
        { dir: 'left', len: 8 },
        { dir: 'up', len: 4 }
      ]
    }
  };

  const stage = document.getElementById('stage');
  const shapeTabs = document.getElementById('shapeTabs');
  const totalEl = document.getElementById('total');
  const stepsListEl = document.getElementById('stepsList');
  const nextBtn = document.getElementById('nextBtn');
  const autoBtn = document.getElementById('autoBtn');
  const restartBtn = document.getElementById('restartBtn');
  const feedback = document.getElementById('feedback');

  let currentShapeKey = 'rect';
  let vertices = [];
  let steps = [];
  let stepIdx = 0;
  let total = 0;
  let walking = false;
  let autoRunning = false;

  function dirDelta(dir, lenPx) {
    if (dir === 'right') return { dx: lenPx, dy: 0 };
    if (dir === 'left') return { dx: -lenPx, dy: 0 };
    if (dir === 'down') return { dx: 0, dy: lenPx };
    return { dx: 0, dy: -lenPx }; // up
  }

  function buildTabs() {
    shapeTabs.innerHTML = '';
    Object.keys(SHAPES).forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'tabBtn' + (key === currentShapeKey ? ' active' : '');
      btn.textContent = SHAPES[key].label;
      btn.addEventListener('click', () => { currentShapeKey = key; loadShape(); });
      shapeTabs.appendChild(btn);
    });
  }

  function loadShape() {
    buildTabs();
    steps = SHAPES[currentShapeKey].steps;
    vertices = [{ x: START.x, y: START.y }];
    let cur = { x: START.x, y: START.y };
    steps.forEach(s => {
      const { dx, dy } = dirDelta(s.dir, s.len * SCALE);
      cur = { x: cur.x + dx, y: cur.y + dy };
      vertices.push(cur);
    });

    stepIdx = 0;
    total = 0;
    walking = false;
    autoRunning = false;
    totalEl.textContent = 0;
    feedback.textContent = '';
    nextBtn.disabled = false;
    autoBtn.disabled = false;

    stage.innerHTML = '';
    stepsListEl.innerHTML = '';

    for (let i = 0; i < steps.length; i++) {
      const v1 = vertices[i], v2 = vertices[i + 1];
      const dx = v2.x - v1.x, dy = v2.y - v1.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const edge = document.createElement('div');
      edge.className = 'edge';
      edge.id = 'edge' + i;
      edge.style.width = len + 'px';
      edge.style.left = v1.x + 'px';
      edge.style.top = v1.y + 'px';
      edge.style.transform = 'rotate(' + angle + 'deg)';
      stage.appendChild(edge);

      const label = document.createElement('div');
      label.className = 'edgeLabel';
      label.id = 'label' + i;
      label.style.left = ((v1.x + v2.x) / 2) + 'px';
      label.style.top = ((v1.y + v2.y) / 2 - 14) + 'px';
      label.textContent = steps[i].len + ' cm';
      stage.appendChild(label);

      const chip = document.createElement('div');
      chip.className = 'stepChip';
      chip.id = 'chip' + i;
      chip.textContent = 'Side ' + (i + 1) + ': ' + steps[i].len + ' cm';
      stepsListEl.appendChild(chip);
    }

    vertices.forEach(v => {
      const dot = document.createElement('div');
      dot.className = 'vertexDot';
      dot.style.left = v.x + 'px';
      dot.style.top = v.y + 'px';
      stage.appendChild(dot);
    });

    const walker = document.createElement('div');
    walker.className = 'walker';
    walker.id = 'walker';
    walker.textContent = '🐢';
    walker.style.left = vertices[0].x + 'px';
    walker.style.top = vertices[0].y + 'px';
    stage.appendChild(walker);
  }

  function walkNextSide(onDone) {
    if (stepIdx >= steps.length || walking) { if (onDone) onDone(false); return; }
    walking = true;
    const walker = document.getElementById('walker');
    const target = vertices[stepIdx + 1];
    walker.style.left = target.x + 'px';
    walker.style.top = target.y + 'px';

    setTimeout(() => {
      document.getElementById('edge' + stepIdx).classList.add('walked');
      document.getElementById('label' + stepIdx).classList.add('walked');
      document.getElementById('chip' + stepIdx).classList.add('done');
      total += steps[stepIdx].len;
      totalEl.textContent = total;
      stepIdx++;
      walking = false;

      if (stepIdx >= steps.length) {
        feedback.textContent = '🎉 Perimeter = ' + total + ' cm! (' + steps.map(s => s.len).join(' + ') + ' = ' + total + ')';
        nextBtn.disabled = true;
        autoBtn.disabled = true;
      } else {
        feedback.textContent = '';
      }
      if (onDone) onDone(true);
    }, 850);
  }

  nextBtn.addEventListener('click', () => walkNextSide());

  autoBtn.addEventListener('click', () => {
    if (autoRunning) return;
    autoRunning = true;
    nextBtn.disabled = true;
    autoBtn.disabled = true;
    function step() {
      walkNextSide((moved) => {
        if (stepIdx < steps.length) {
          setTimeout(step, 400);
        } else {
          autoRunning = false;
        }
      });
    }
    step();
  });

  restartBtn.addEventListener('click', loadShape);

  loadShape();
</script>

</body>
</html>
