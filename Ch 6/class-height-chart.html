<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Class Height Chart | Class 4 Measuring Length</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: linear-gradient(160deg, #e8f7ff 0%, #fef9e7 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 1000px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    padding: 20px 28px 28px;
  }
  header { text-align: center; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 2rem; color: #2b6cb0; }
  .subtitle { margin: 6px 0 0; color: #555; font-size: 1rem; }

  .formRow {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
    background: #f0f7ff;
    border-radius: 14px;
    padding: 14px;
    margin: 18px 0;
  }
  .formRow input {
    font-size: 1.05rem;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #bcd8f5;
  }
  #nameInput { width: 200px; }
  #heightInput { width: 130px; }
  .formRow button {
    font-size: 1.05rem;
    font-weight: 700;
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #38a169;
    color: #fff;
  }
  .formRow button:active { transform: scale(0.96); }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-size: 0.95rem;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 10px;
    border: 2px solid #cbd5e0;
    background: #f7fafc;
    cursor: pointer;
    color: #444;
  }
  .toolbar button.active { background: #bee3f8; border-color: #3182ce; color: #2c5282; }
  #clearBtn { border-color: #feb2b2; color: #c53030; }

  .statsRow {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin: 8px 0 20px;
  }
  .statCard {
    background: #fffaf0;
    border: 2px solid #ecc94b;
    border-radius: 12px;
    padding: 10px 16px;
    font-weight: 700;
    color: #7a5b00;
    text-align: center;
    min-width: 150px;
  }
  .statCard .big { font-size: 1.2rem; display: block; margin-top: 2px; }

  .chartWrap {
    background: #fbfdff;
    border: 3px dashed #bcd8f5;
    border-radius: 18px;
    padding: 24px 16px 12px;
    overflow-x: auto;
  }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    min-height: 260px;
    padding: 0 10px;
  }
  .barCol {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
  }
  .barValue { font-weight: 800; color: #2b6cb0; margin-bottom: 4px; font-size: 0.95rem; }
  .bar {
    width: 46px;
    background: linear-gradient(180deg, #63b3ed, #2b6cb0);
    border-radius: 8px 8px 0 0;
    position: relative;
    transition: height 0.5s ease;
  }
  .bar.tallest { background: linear-gradient(180deg, #f6ad55, #dd6b20); }
  .bar.shortest { background: linear-gradient(180deg, #68d391, #2f855a); }
  .crown, .star {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.2rem;
  }
  .barName {
    margin-top: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    color: #444;
    text-align: center;
    max-width: 70px;
    word-break: break-word;
  }
  .delBtn {
    margin-top: 4px;
    font-size: 0.75rem;
    color: #c53030;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .empty {
    text-align: center;
    color: #a0aec0;
    font-weight: 700;
    padding: 40px 0;
    font-size: 1.05rem;
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    #nameInput { width: 140px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>📊 Our Class Height Chart</h1>
    <p class="subtitle">Add each student's height to build a live class chart — who's tallest? Who's shortest?</p>
  </header>

  <div class="formRow">
    <input type="text" id="nameInput" placeholder="Student's name" maxlength="20" />
    <input type="number" id="heightInput" placeholder="Height (cm)" min="50" max="200" />
    <button id="addBtn">➕ Add Student</button>
  </div>

  <div class="toolbar">
    <button id="sortOrderBtn" class="active">🔤 Sort: Order Added</button>
    <button id="sortHeightBtn">📏 Sort: By Height</button>
    <button id="clearBtn">🗑️ Clear All</button>
  </div>

  <div class="statsRow" id="statsRow"></div>

  <div class="chartWrap">
    <div class="chart" id="chart"></div>
  </div>
</div>

<script>
  const nameInput = document.getElementById('nameInput');
  const heightInput = document.getElementById('heightInput');
  const addBtn = document.getElementById('addBtn');
  const chart = document.getElementById('chart');
  const statsRow = document.getElementById('statsRow');
  const sortOrderBtn = document.getElementById('sortOrderBtn');
  const sortHeightBtn = document.getElementById('sortHeightBtn');
  const clearBtn = document.getElementById('clearBtn');

  let students = [];
  let sortMode = 'order'; // 'order' | 'height'

  function addStudent() {
    const name = nameInput.value.trim();
    const height = parseFloat(heightInput.value);
    if (!name) { alert('Please type the student\'s name.'); return; }
    if (isNaN(height) || height < 50 || height > 200) { alert('Please enter a height between 50 and 200 cm.'); return; }
    students.push({ name, height });
    nameInput.value = '';
    heightInput.value = '';
    nameInput.focus();
    render();
  }

  function removeStudent(idx) {
    students.splice(idx, 1);
    render();
  }

  function setSort(mode) {
    sortMode = mode;
    sortOrderBtn.classList.toggle('active', mode === 'order');
    sortHeightBtn.classList.toggle('active', mode === 'height');
    render();
  }

  function render() {
    chart.innerHTML = '';
    statsRow.innerHTML = '';

    if (students.length === 0) {
      chart.innerHTML = '<div class="empty">No students added yet — enter a name and height above to begin!</div>';
      return;
    }

    const maxH = Math.max(...students.map(s => s.height));
    const minH = Math.min(...students.map(s => s.height));
    const avg = (students.reduce((sum, s) => sum + s.height, 0) / students.length).toFixed(1);
    const tallest = students.find(s => s.height === maxH);
    const shortest = students.find(s => s.height === minH);

    statsRow.innerHTML =
      '<div class="statCard">Tallest<span class="big">👑 ' + tallest.name + ' — ' + tallest.height + ' cm</span></div>' +
      '<div class="statCard">Shortest<span class="big">⭐ ' + shortest.name + ' — ' + shortest.height + ' cm</span></div>' +
      '<div class="statCard">Class Average<span class="big">📐 ' + avg + ' cm</span></div>' +
      '<div class="statCard">Students<span class="big">👥 ' + students.length + '</span></div>';

    let list = students.map((s, i) => ({ ...s, origIndex: i }));
    if (sortMode === 'height') list = list.slice().sort((a, b) => b.height - a.height);

    const maxBarPx = 220;
    list.forEach(s => {
      const col = document.createElement('div');
      col.className = 'barCol';

      const val = document.createElement('div');
      val.className = 'barValue';
      val.textContent = s.height + ' cm';
      col.appendChild(val);

      const bar = document.createElement('div');
      bar.className = 'bar';
      const heightPx = Math.max(14, (s.height / maxH) * maxBarPx);
      bar.style.height = heightPx + 'px';
      if (s.height === maxH) { bar.classList.add('tallest'); bar.innerHTML = '<div class="crown">👑</div>'; }
      else if (s.height === minH) { bar.classList.add('shortest'); bar.innerHTML = '<div class="star">⭐</div>'; }
      col.appendChild(bar);

      const nameEl = document.createElement('div');
      nameEl.className = 'barName';
      nameEl.textContent = s.name;
      col.appendChild(nameEl);

      const del = document.createElement('button');
      del.className = 'delBtn';
      del.textContent = 'remove';
      del.addEventListener('click', () => removeStudent(s.origIndex));
      col.appendChild(del);

      chart.appendChild(col);
    });
  }

  addBtn.addEventListener('click', addStudent);
  heightInput.addEventListener('keydown', e => { if (e.key === 'Enter') addStudent(); });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') heightInput.focus(); });
  sortOrderBtn.addEventListener('click', () => setSort('order'));
  sortHeightBtn.addEventListener('click', () => setSort('height'));
  clearBtn.addEventListener('click', () => {
    if (students.length && !confirm('Clear all students from the chart?')) return;
    students = [];
    render();
  });

  render();
</script>

</body>
</html>
